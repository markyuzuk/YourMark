<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrialFit — Swipe Screener</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#16243d;min-height:100dvh;display:flex;justify-content:center;font-family:Inter,system-ui,sans-serif;color:#f6eedd;overflow:hidden}
.stage{width:min(420px,100vw);height:100dvh;display:flex;flex-direction:column;padding:14px}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px}
.logo{font-family:Bungee;font-size:18px;color:#f2b632}
.logo span{color:#0f9d8f}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:#2c3d5c}
.dots i.on{background:#f2b632}
.deck{flex:1;position:relative;perspective:800px}
.card{position:absolute;left:50%;top:44%;width:min(320px,86vw);height:430px;transform:translate(-50%,-50%);
  background:#fdf6e3;color:#16243d;border-radius:24px;padding:30px 26px;box-shadow:0 14px 40px rgba(0,0,0,.45);
  display:flex;flex-direction:column;touch-action:none;user-select:none;cursor:grab;transition:transform .18s ease-out}
.card.back1{transform:translate(-50%,-50%) rotate(3deg) scale(.96)}
.card.back2{transform:translate(-50%,-50%) rotate(-4deg) scale(.92)}
.tag{display:inline-block;align-self:flex-start;background:#e8f6f4;color:#0f9d8f;font-weight:800;font-size:11px;
  letter-spacing:1.5px;padding:4px 10px;border-radius:20px;margin-bottom:18px}
.card .ic{font-size:64px;margin:6px 0 14px}
.card h2{font-size:23px;line-height:1.35;font-weight:800}
.card .hint{margin-top:auto;font-size:12px;color:#8a7a66;text-align:center}
.stamp{position:absolute;top:26px;font-family:Bungee;font-size:26px;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0}
.stamp.yes{left:18px;color:#0f9d8f;border-color:#0f9d8f;transform:rotate(-14deg)}
.stamp.no{right:18px;color:#d6342b;border-color:#d6342b;transform:rotate(14deg)}
.stamp.sure{left:50%;transform:translateX(-50%) rotate(-6deg);color:#b8860b;border-color:#b8860b;top:44%}
.btns{display:flex;justify-content:center;gap:26px;padding:16px 0 8px}
.btns button{width:62px;height:62px;border-radius:50%;border:3px solid #2c3d5c;background:#1e3050;color:#f6eedd;font-size:24px;cursor:pointer;transition:transform .1s}
.btns button:active{transform:scale(.9)}
.btns .y{border-color:#0f9d8f;color:#0f9d8f}
.btns .n{border-color:#d6342b;color:#d6342b}
.result{position:fixed;inset:0;background:rgba(10,18,32,.94);display:none;align-items:center;justify-content:center;z-index:5}
.result.on{display:flex}
.rcard{width:min(340px,88vw);background:#fdf6e3;color:#16243d;border-radius:24px;padding:30px 24px;text-align:center;position:relative}
.ring{width:150px;height:150px;margin:0 auto 10px}
.ring circle{fill:none;stroke-width:11}
.ring .bg{stroke:#e5d9c0}
.ring .fg{stroke:#0f9d8f;stroke-linecap:round;stroke-dasharray:396;stroke-dashoffset:396;transition:stroke-dashoffset 1.2s ease}
.ring text{font-family:Bungee;font-size:34px;fill:#16243d}
.tier{font-family:Bungee;font-size:24px;margin:8px 0 6px}
.tier.hi{color:#0f9d8f}.tier.mid{color:#b8860b}.tier.lo{color:#d6342b}
.rcard p{font-size:13.5px;line-height:1.55;color:#5c4d3a}
.rcard .cta{display:block;width:100%;margin-top:18px;padding:15px;border:none;border-radius:14px;background:#0f9d8f;color:#fff;font-family:Bungee;font-size:15px;cursor:pointer}
.rcard .again{display:inline-block;margin-top:12px;font-size:12px;color:#8a7a66}
.cfetti{position:absolute;width:9px;height:14px;top:-12px;border-radius:2px;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(560px) rotate(560deg);opacity:0}}
.footer{font-size:11px;color:#5c7199;text-align:center;padding:8px 0 4px}
</style>
</head>
<body>
<div class="stage">
  <div class="top"><div class="logo">TRIAL<span>FIT</span></div><div class="dots" id="dots"></div></div>
  <div class="deck" id="deck"></div>
  <div class="btns">
    <button class="n" onclick="answer(-1)">✕</button>
    <button class="m" onclick="answer(0)">?</button>
    <button class="y" onclick="answer(1)">✓</button>
  </div>
  <div class="footer">concept demo — answers never leave this device</div>
</div>

<div class="result" id="result"><div class="rcard" id="rcard"></div></div>

<script>
const DECK=[
 {icon:'🧠',tag:'INTEREST',q:'Have you or a loved one noticed changes in memory or thinking?'},
 {icon:'📅',tag:'ELIGIBILITY',q:'Are you between 50 and 85 years old?'},
 {icon:'📍',tag:'LOGISTICS',q:'Can you attend study visits in Springfield or nearby?'},
 {icon:'🤝',tag:'SUPPORT',q:'Is there someone who could join visits as your study partner?'},
 {icon:'💊',tag:'COMFORT',q:'Are you comfortable trying a study medication (or placebo)?'},
 {icon:'🚀',tag:'LAST ONE',q:'Want to learn more about the SPARKLE study?'}
];
let i=0,score=0;
const deck=document.getElementById('deck'),dots=document.getElementById('dots');
function renderDots(){dots.innerHTML=DECK.map((_,k)=>`<i class="${k<i?'on':''}"></i>`).join('');}
function render(){
  renderDots();
  if(i>=DECK.length)return finish();
  const c=DECK[i];
  deck.innerHTML=`
    ${DECK[i+2]?'<div class="card back2"></div>':''}
    ${DECK[i+1]?'<div class="card back1"></div>':''}
    <div class="card" id="top">
      <span class="tag">${c.tag}</span>
      <div class="ic">${c.icon}</div>
      <h2>${c.q}</h2>
      <div class="hint">swipe ✓ yes · ✕ no · ↑ not sure</div>
      <div class="stamp yes" id="stY">YES</div>
      <div class="stamp no" id="stN">NO</div>
      <div class="stamp sure" id="stS">NOT SURE</div>
    </div>`;
  bind(document.getElementById('top'));
}
function bind(el){
  let sx=0,sy=0,dx=0,dy=0,drag=false;
  const stY=el.querySelector('#stY'),stN=el.querySelector('#stN'),stS=el.querySelector('#stS');
  el.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId);el.style.transition='none';});
  el.addEventListener('pointermove',e=>{
    if(!drag)return;
    dx=e.clientX-sx;dy=e.clientY-sy;
    el.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy*.4}px)) rotate(${dx/14}deg)`;
    stY.style.opacity=Math.max(0,Math.min(1,dx/90));
    stN.style.opacity=Math.max(0,Math.min(1,-dx/90));
    stS.style.opacity=Math.max(0,Math.min(1,-dy/90));
  });
  el.addEventListener('pointerup',()=>{
    if(!drag)return;drag=false;el.style.transition='';
    if(dx>110)return fly(1);
    if(dx<-110)return fly(-1);
    if(dy<-110)return fly(0);
    el.style.transform='translate(-50%,-50%)';
    stY.style.opacity=stN.style.opacity=stS.style.opacity=0;
    dx=dy=0;
  });
}
function fly(v){
  const el=document.getElementById('top');if(!el)return;
  const x=v===0?0:v*window.innerWidth*1.2,y=v===0?-600:0;
  el.style.transition='transform .3s ease-in';
  el.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) rotate(${v*25}deg)`;
  setTimeout(()=>answer(v),180);
}
function answer(v){
  if(i>=DECK.length)return;
  if(v===1)score++;if(v===0)score+=.5;
  i++;render();
}
function finish(){
  const pct=Math.round(score/DECK.length*100);
  const tier=pct>=75?['STRONG MATCH','hi','You look like a great fit for SPARKLE. A coordinator will confirm details — no commitment yet.']
    :pct>=40?['POSSIBLE MATCH','mid','A coordinator can confirm the details on a quick call.']
    :['MIGHT NOT FIT','lo','This one may not fit — but another study might. Want to hear about it?'];
  document.getElementById('rcard').innerHTML=`
    <svg class="ring" viewBox="0 0 140 140">
      <circle class="bg" cx="70" cy="70" r="63"/>
      <circle class="fg" id="fg" cx="70" cy="70" r="63" transform="rotate(-90 70 70)"/>
      <text x="70" y="82" text-anchor="middle">${pct}%</text>
    </svg>
    <div class="tier ${tier[1]}">${tier[0]}</div>
    <p>${tier[2]}</p>
    <button class="cta" onclick="alert('Demo: this is where a 1-tap contact request or calendar booking would go.')">TALK TO THE STUDY TEAM →</button>
    <a class="again" onclick="i=0;score=0;document.getElementById('result').classList.remove('on');render()">↻ swipe again</a>`;
  const r=document.getElementById('result');r.classList.add('on');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.getElementById('fg').style.strokeDashoffset=396-396*pct/100;
    confetti();
  }));
}
function confetti(){
  const cols=['#f2b632','#0f9d8f','#d6342b','#7c9ef5'];
  const rc=document.getElementById('rcard');
  for(let k=0;k<26;k++){
    const s=document.createElement('div');s.className='cfetti';
    s.style.left=(8+Math.random()*84)+'%';s.style.background=cols[k%4];
    s.style.animationDelay=(Math.random()*.5)+'s';
    rc.appendChild(s);setTimeout(()=>s.remove(),2400);
  }
}
render();
</script>
</body>
</html>
